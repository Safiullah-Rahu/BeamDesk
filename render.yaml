# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/Safiullah-Rahu/BeamDesk
#
# The free plan is enough to try BeamDesk (it sleeps after 15 minutes without traffic, and the
# device registry starts empty after each restart). For real use pick "starter" and uncomment
# the disk, so device IDs stay protected across restarts.
services:
  - type: web
    name: beamdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "true"
      - key: SERVER_NAME
        value: BeamDesk
      - key: ACCESS_KEY
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
    # disk:
    #   name: beamdesk-data
    #   mountPath: /data
    #   sizeGB: 1
