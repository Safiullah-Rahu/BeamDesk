# Packaging for Windows, macOS and Linux. Run from apps/desktop: npm run dist
appId: io.github.safiullahrahu.beamdesk
productName: BeamDesk
copyright: Copyright © 2026 Neurosmith
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - web/**
  - build/icon.png
  - build/icon.ico
  - build/tray.png
  - package.json
  - "!**/*.map"

# @jitsi/robotjs ships N-API prebuilds that work with any Electron version: no rebuild needed.
npmRebuild: false

# Native input driver must live outside the asar archive.
asarUnpack:
  - "**/node_modules/@jitsi/robotjs/**"

# Electron fuses, flipped in the binary at build time. They switch off ways to make the signed
# app run other code: as a plain Node.js (ELECTRON_RUN_AS_NODE), with NODE_OPTIONS or --inspect,
# or with a modified app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

protocols:
  - name: BeamDesk link
    schemes: [beamdesk]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

# One click: double-click the installer and BeamDesk is ready.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BeamDesk
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

# Runs without installing, like a classic support tool.
portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    NSScreenCaptureUsageDescription: BeamDesk shares your screen only with people you accept.
    NSMicrophoneUsageDescription: BeamDesk does not use your microphone.

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  executableName: beamdesk
  icon: build/icon.png
  category: Network
  synopsis: Open-source, end-to-end encrypted remote desktop
  description: BeamDesk lets you help and access computers remotely with end-to-end encryption.
  maintainer: Neurosmith <safiullahrahu1555@gmail.com>
  target:
    - AppImage
    - deb
  desktop:
    entry:
      MimeType: x-scheme-handler/beamdesk;
      StartupWMClass: BeamDesk

deb:
  depends: [libxtst6, libnss3, libgbm1]

publish:
  provider: github
  owner: Safiullah-Rahu
  repo: BeamDesk
  releaseType: release
