# Fly.io deployment (signaling + web app). From the repository root:
#   fly launch --copy-config --config deploy/fly.toml --no-deploy
#   fly volumes create beamdesk_data --size 1 --config deploy/fly.toml
#   fly deploy --config deploy/fly.toml
app = "beamdesk"
primary_region = "ams"

[build]
  dockerfile = "../Dockerfile"

[env]
  TRUST_PROXY = "true"
  SERVER_NAME = "BeamDesk"

[mounts]
  source = "beamdesk_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Devices keep a WebSocket open to receive connection requests: never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
