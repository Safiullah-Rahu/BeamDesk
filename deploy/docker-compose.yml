# Production deployment: BeamDesk server + automatic HTTPS (Caddy) + TURN relay (coturn).
#
#   cp .env.example .env     # set DOMAIN and TURN_SECRET
#   docker compose up -d
#
# Open ports: 80/tcp, 443/tcp (HTTPS), 3478/tcp+udp (TURN), 49160-49200/udp (TURN relay).
name: beamdesk

services:
  beamdesk:
    image: ghcr.io/safiullah-rahu/beamdesk-server:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-BeamDesk}
      TRUST_PROXY: "true"
      ACCESS_KEY: ${ACCESS_KEY:-}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      DOWNLOAD_URL: ${DOWNLOAD_URL:-https://github.com/Safiullah-Rahu/BeamDesk/releases/latest}
    volumes:
      - beamdesk-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - beamdesk

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    # Host networking: TURN needs a large UDP port range and the real public IP.
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN}
      TURN_SECRET: ${TURN_SECRET}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec turnserver -n --log-file=stdout --no-cli --fingerprint
        --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm="$$DOMAIN"
        --listening-port=3478 --min-port=49160 --max-port=49200
        --external-ip="$${TURN_EXTERNAL_IP:-$$(detect-external-ip)}"
        --no-multicast-peers --no-tlsv1 --no-tlsv1_1 --stale-nonce=600
        --user-quota=12 --total-quota=1200
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1 --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  beamdesk-data:
  caddy-data:
  caddy-config:
