# Keeps dependencies, GitHub Actions and the Docker base image up to date with security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node.js version CI and the server image run on; bump them together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node.js majors are a deliberate move (CI, image and types together), not an automatic one.
      - dependency-name: node
        update-types: ['version-update:semver-major']
