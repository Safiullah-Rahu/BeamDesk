name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system libraries for the desktop test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libxtst6 libnss3 libgbm1 libasound2t64
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app, server and desktop bundles
        run: |
          npm run build:web
          npm run build -w server
          npm run build -w apps/desktop
      - run: npx playwright install chromium
      - name: End-to-end tests (browser to browser)
        run: npx playwright test -c e2e/playwright.config.ts web.spec.ts
      - name: End-to-end test (desktop app as host)
        env:
          BEAMDESK_E2E_DESKTOP: '1'
        run: xvfb-run -a -s "-screen 0 1280x800x24" npx playwright test -c e2e/playwright.config.ts desktop.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
