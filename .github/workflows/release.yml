# Builds installers for Windows, macOS and Linux and attaches them to a GitHub release.
#
# Publish a release, either way:
#   - Actions tab -> "Release desktop apps" -> Run workflow (branch: main), enter the version,
#     e.g. v1.0.0. It must match "version" in package.json. The workflow builds the installers,
#     then creates the tag and the release itself.
#   - Or push a tag: git tag v1.0.0 && git push origin v1.0.0
# Run workflow with the version left empty only builds the installers (downloadable artifacts).
#
# Optional repository settings (Settings -> Secrets and variables -> Actions):
#   variable BEAMDESK_SERVER_URL   your server, baked into the apps so users never type it
#   secrets  CSC_LINK / CSC_KEY_PASSWORD            code signing certificate (Windows/macOS)
#   secrets  APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   macOS notarization
#
# Security: the build jobs run third-party build tooling, so they only get a read-only token and
# keep no git credentials. Only the small publish job can write, and it runs no project code.
name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.0.0 (must match package.json). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  # Decides what gets published before anything is built, so a typo fails in seconds.
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag="$INPUT"; fi
          if [ -n "$tag" ]; then
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The version must look like v1.2.3 (got '$tag')"; exit 1
            fi
            if [ "$tag" != "$expected" ]; then
              echo "::error::Version $tag does not match package.json ($expected): update package.json first"; exit 1
            fi
            if [ "$REF_TYPE" != tag ]; then
              if [ "$REF_NAME" != main ]; then echo "::error::Publish releases from main"; exit 1; fi
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                echo "::error::Tag $tag already exists: bump the version in package.json for a new release"; exit 1
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tag:-nothing (build only)}"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: --win }
          - { name: macOS, os: macos-latest, args: --mac }
          - { name: Linux, os: ubuntu-latest, args: --linux }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          BEAMDESK_SERVER_URL: ${{ vars.BEAMDESK_SERVER_URL }}
        run: |
          npm run build:web
          npm run build -w apps/desktop
      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset secrets that are not configured: electron-builder treats empty values as real ones.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          extra=()
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate, ad-hoc sign macOS builds (Apple silicon refuses unsigned apps).
            # The hardened runtime needs a real signing identity (library validation), so it is
            # only enabled for signed builds.
            if [ "$RUNNER_OS" = "macOS" ]; then extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          fi
          npx electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: BeamDesk-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Starts the server image build for the new tag (tags created with this token start no workflows).
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
          FROM_TAG_PUSH: ${{ github.ref_type == 'tag' }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # From "Run workflow" the tag does not exist yet: create it on the commit that was built.
            gh release create "$TAG" dist/* --title "BeamDesk $TAG" --generate-notes --target "$SHA"
          fi
          if [ "$FROM_TAG_PUSH" != true ]; then
            gh workflow run docker.yml --ref "$TAG"
          fi
