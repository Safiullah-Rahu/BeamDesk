# Publishes the browser version as a static website on GitHub Pages
# (https://<owner>.github.io/<repo>/). Phones and other devices without the app open it to reach a
# home server through its beacon, with no BeamDesk server needed at that address.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then this workflow builds the site and skips publishing (with a notice).
name: Browser version on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/core/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the browser version for a static website
        run: npm run build:web
        env:
          BEAMDESK_STATIC_SITE: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Check that GitHub Pages is set up
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set up for this repository yet: Settings -> Pages -> Source: GitHub Actions. The site was built but not published."
          fi

  deploy:
    name: Publish
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
